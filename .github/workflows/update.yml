name: Update papers board

on:
  schedule:
    - cron: "47 21 * * *"        # 매일 06:47 KST (UTC 21:47)
  workflow_dispatch:              # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: daily
        options: [daily, backfill, refresh-citations, reclassify, build]
      limit:
        description: "테스트용: 검색어당 최대 논문 수 (비워두면 전체)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: papers-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python -m board.run "$MODE" ${LIMIT:+--limit "$LIMIT"}

      - name: Weekly citation refresh (Mondays)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python -m board.run refresh-citations; fi

      - name: Commit data
        run: |
          git config user.name  "papers-board-bot"
          git config user.email "papers-board-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Board update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
