      - ACS ES&T Engineering
      - Applied Surface Science

# true  → 화이트리스트 저널만 보드에 올림 (엄격한 SCI 보드)
# false → 다른 저널도 올리되 "Other journals"로 표시
only_listed_journals: false

pipeline:
  model: "claude-haiku-5-5"        # 분류용 모델 (저렴·빠름). 더 정밀하게: claude-sonnet-5-5
  batch_size: 10                   # Claude 호출 1회당 논문 수
  daily_lookback_days: 30          # 매일 실행 시 최근 N일 출판분을 다시 훑음 (늦게 색인되는 논문 대비)
  min_lab_score_to_highlight: 70   # 이 점수 이상은 보드에서 ★강조
  include_types: ["article", "review"]
